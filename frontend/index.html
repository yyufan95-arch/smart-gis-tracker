<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Smart Tour GIS 인도네시아 관광객 추적 시스템</title>
    <!-- 1. Leaflet 라이브러리 로드 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 2. 기초 레이아웃 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background: #f0f0f0;
        }

        /* 3. 왼쪽 패널: 고정 너비 */
        #sidebar {
            position: absolute;
            top: 0;
            left: 0;
            width: 320px;
            height: 100vh;
            background: #ffffff;
            border-right: 2px solid #e0e0e0;
            z-index: 1000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        /* 4. 오른쪽 지도: 나머지 공간 차지 */
        #map {
            position: absolute;
            top: 0;
            left: 320px;
            right: 0;
            bottom: 0;
            background: #e5e3df;
            z-index: 1;
        }

        /* 디자인 스타일 */
        h1 { color: #1a73e8; font-size: 24px; margin-bottom: 4px; }
        .info-text { font-size: 13px; color: #666; line-height: 1.6; margin-bottom: 10px; }
        
        .task-item {
            padding: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }
        .task-item.active {
            border-left: 5px solid #34a853;
            background: #f0fff4;
            color: #2e7d32;
            font-weight: bold;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background: #1557b0; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        .log-box {
            flex: 1;
            background: #1e1e1e;
            color: #34a853;
            padding: 12px;
            border-radius: 6px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            margin-top: 10px;
            border: 1px solid #333;
        }
        .log-entry { border-bottom: 1px solid #333; padding: 4px 0; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Smart Tour GIS</h1>
        <div class="info-text">
            <b>미션 대상:</b> 인도네시아 단체 (20명)<br>
            <b>좌표 시스템:</b> WGS84 (자카르타)
        </div>

        <div class="task-item" id="step-A">Step A. 신원 인증 및 체크인</div>
        <div class="task-item" id="step-B">Step B. 문화 체험 참여</div>
        <div class="task-item" id="step-C">Step C. 비용 결제 완료</div>
        <div class="task-item" id="step-D">Step D. 전체 미션 달성</div>

        <button class="btn" id="authBtn">Step A 인증 수행</button>

        <p style="margin-top: 10px; font-size: 12px; font-weight: bold; color: #444;">실시간 데이터베이스 시뮬레이션 (JSON):</p>
        <div class="log-box" id="logBox">인증 기록 대기 중...</div>
    </div>

    <!-- 지도 컨테이너 -->
    <div id="map"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log("지도 초기화 중...");

            // 1. 지도 초기화 (자카르타 중심점)
            const map = L.map('map', {
                zoomControl: false 
            }).setView([-6.2088, 106.8456], 13);

            // 2. CartoDB Voyager 타일 레이어 로드
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            // 줌 컨트롤 우측 상단에 추가
            L.control.zoom({ position: 'topright' }).addTo(map);

            // 3. A/B/C/D 인증 지점 정의
            const points = [
                { id: 'A', name: "A-신원 인증 지점", lat: -6.2088, lng: 106.8456 },
                { id: 'B', name: "B-문화 체험 지점", lat: -6.2100, lng: 106.8500 },
                { id: 'C', name: "C-비용 결제 지점", lat: -6.2050, lng: 106.8400 },
                { id: 'D', name: "D-최종 도착 지점", lat: -6.2120, lng: 106.8350 }
            ];

            const markers = {};
            const latlngs = points.map(p => [p.lat, p.lng]);

            // 마커 및 경로선 추가
            points.forEach(p => {
                markers[p.id] = L.marker([p.lat, p.lng]).addTo(map);
                markers[p.id].bindPopup(`<b>${p.name}</b>`);
            });

            L.polyline(latlngs, { color: '#d93025', weight: 4, opacity: 0.7, dashArray: '5, 10' }).addTo(map);

            // 4. 패널 로직
            const authBtn = document.getElementById('authBtn');
            const logBox = document.getElementById('logBox');
            let currentStepIdx = 0;

            function updateLog() {
                const records = JSON.parse(localStorage.getItem('tourRecords') || '[]');
                if (records.length === 0) {
                    logBox.innerHTML = "인증 기록 대기 중...";
                    return;
                }
                logBox.innerHTML = records.map(r => 
                    `<div class="log-entry">
                        <span style="color: #aaa;">[${r.time.split(' ')[1]}]</span> 
                        <b style="color: #fff;">${r.step}</b>: ${r.status}
                    </div>`
                ).join('');
                logBox.scrollTop = logBox.scrollHeight;
            }

            authBtn.addEventListener('click', function() {
                if (currentStepIdx >= points.length) return;

                const p = points[currentStepIdx];
                const now = new Date();
                
                const record = {
                    time: now.toLocaleString(),
                    step: p.id,
                    status: "인증 통과됨",
                    coords: `${p.lat}, ${p.lng}`
                };

                // 데이터 저장
                const records = JSON.parse(localStorage.getItem('tourRecords') || '[]');
                records.push(record);
                localStorage.setItem('tourRecords', JSON.stringify(records));

                // UI 업데이트
                document.getElementById(`step-${p.id}`).classList.add('active');
                map.flyTo([p.lat, p.lng], 15);
                markers[p.id].openPopup();

                currentStepIdx++;

                if (currentStepIdx < points.length) {
                    authBtn.textContent = `Step ${points[currentStepIdx].id} 인증 수행`;
                } else {
                    authBtn.textContent = "모든 미션 완료 ✓";
                    authBtn.disabled = true;
                }
                updateLog();
            });

            // 초기화: 기존 데이터 삭제(시연용) 및 로그 업데이트
            localStorage.removeItem('tourRecords'); 
            updateLog();

            // 렌더링 오류 방지를 위한 지도 크기 재계산
            setTimeout(() => { map.invalidateSize(); }, 500);
        });
    </script>
</body>
</html>
