<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Jeonju GIS Tracker - Final</title>
    <!-- 引入地图样式 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* 1. 强制全屏，不使用 Flex，防止塌陷 */
        html, body { 
            height: 100%; 
            width: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #f0f0f0; 
        }

        /* 2. 侧边栏：固定在左侧 */
        #sidebar {
            position: absolute;
            top: 0; left: 0;
            width: 350px; height: 100%;
            background: white;
            border-right: 2px solid #1a73e8;
            z-index: 2000; /* 确保在最前面 */
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* 3. 地图区域：固定在右侧，占据剩余所有空间 */
        #map {
            position: absolute;
            top: 0; left: 350px;
            right: 0; bottom: 0;
            background: #e5e3df; /* 基础底色 */
            z-index: 1;
        }

        h2 { color: #1a73e8; margin-bottom: 15px; }
        .task-item { 
            padding: 12px; margin-bottom: 8px; 
            border: 1px solid #ddd; border-radius: 6px; 
            font-size: 14px; background: #fff;
        }
        .done { 
            background: #e6f4ea !important; 
            border-left: 6px solid #34a853 !important; 
            color: #1e8e3e !important; font-weight: bold;
        }
        button {
            width: 100%; padding: 15px; background: #1a73e8;
            color: white; border: none; border-radius: 6px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            margin: 10px 0;
        }
        #log {
            flex: 1; background: #202124; color: #34a853;
            padding: 10px; font-size: 11px; border-radius: 4px;
            overflow-y: auto; white-space: pre-wrap; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Smart Tour GIS</h2>
        <div style="font-size: 12px; color: #666; margin-bottom: 15px;">
            游客组: 印尼团 (20人)<br>
            坐标系: WGS84 (Jeonju)
        </div>
        
        <div id="steps">
            <div id="stepA" class="task-item">Step A. 身份认证签到</div>
            <div id="stepB" class="task-item">Step B. 文化体验参与</div>
            <div id="stepC" class="task-item">Step C. 费用结算完成</div>
            <div id="stepD" class="task-item">Step D. 全程任务达成</div>
        </div>

        <button onclick="runCertification()">执行当前位置认证</button>

        <small style="margin-top:15px; color:#888;">实时模拟数据库 (JSON):</small>
        <div id="log">等待认证记录...</div>
    </div>

    <!-- 地图容器 -->
    <div id="map"></div>

    <!-- 脚本加载 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        // 核心坐标：全州市韩屋村附近
        const jeonjuCoords = [
            [35.8147, 127.1526], // A: 韩屋村
            [35.8180, 127.1430], // B: 客舍
            [35.8200, 127.1250], // C: 丰南门
            [35.8440, 127.1300]  // D: 全北大学附近
        ];

        function init() {
            console.log("正在初始化地图...");
            // 1. 创建地图
            map = L.map('map').setView([35.8147, 127.1526], 14);

            // 2. 加载地图图片 - 换一个韩国本地最快的源 (VWorld)
            L.tileLayer('https://xdworld.vworld.kr/2d-tiles/Base/service/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; VWorld'
            }).addTo(map);

            // 3. 画出追踪红线
            L.polyline(jeonjuCoords, {color: 'red', weight: 4, opacity: 0.7}).addTo(map);

            // 4. 放置 A,B,C,D 标记
            const labels = ['A', 'B', 'C', 'D'];
            jeonjuCoords.forEach((pos, i) => {
                L.marker(pos).addTo(map)
                 .bindTooltip("<b>" + labels[i] + "</b>", {permanent: true, direction: 'top'});
            });
            
            console.log("地图加载尝试已完成。");
        }

        let currentIdx = 0;
        const steps = ['A', 'B', 'C', 'D'];

        function runCertification() {
            if (currentIdx >= steps.length) return alert("任务已全部完成！");

            let id = steps[currentIdx];
            let time = new Date().toLocaleTimeString();
            
            // 数据加密 (Base64)
            let token = btoa(id + "|" + time).split("").reverse().join("");

            // 存入模拟 DB
            let db = JSON.parse(localStorage.getItem('jeonju_db') || "[]");
            db.push({ step: id, time: time, auth: token });
            localStorage.setItem('jeonju_db', JSON.stringify(db));

            // 更新左侧列表 UI
            document.getElementById('step' + id).className = 'task-item done';
            document.getElementById('step' + id).innerHTML += " ✓";
            
            // 更新 JSON 日志
            document.getElementById('log').innerText = JSON.stringify(db, null, 2);

            // 地图自动跳转
            map.flyTo(jeonjuCoords[currentIdx], 16);

            currentIdx++;
        }

        // 启动
        window.onload = init;
    </script>
</body>
</html>
