<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Smart Tour GIS 印尼游客追踪系统</title>
    <!-- 引入Leaflet地图库 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }
        html, body {
            height: 100vh !important;
            width: 100vw !important;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 左侧面板：固定定位 */
        #sidebar {
            position: absolute;
            top: 0;
            left: 0;
            width: 320px;
            height: 100vh;
            background: #ffffff;
            border-right: 2px solid #e0e0e0;
            z-index: 1000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 右侧地图：绝对定位，撑满剩余空间（核心修复） */
        #map {
            position: absolute;
            top: 0;
            left: 320px;
            right: 0;
            bottom: 0;
            background: #f5f5f5;
            z-index: 1;
        }

        /* 面板样式 */
        .task-item {
            padding: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: #fff;
            font-size: 15px;
        }
        .task-item.active {
            border-color: #1a73e8;
            background: #e3f2fd;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn:disabled {
            background: #90caf9;
            cursor: not-allowed;
        }
        .log-box {
            margin-top: 12px;
            flex: 1;
            background: #1e1e1e;
            color: #00ff00;
            padding: 12px;
            border-radius: 6px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        h1 {
            color: #1a73e8;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .info-text {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <!-- 左侧任务面板 -->
    <div id="sidebar">
        <h1>Smart Tour GIS</h1>
        <div class="info-text">
            游客组: 印尼团 (20人)<br>
            坐标系: WGS84 (雅加达)
        </div>

        <div class="task-item" data-step="A">Step A. 身份认证签到</div>
        <div class="task-item" data-step="B">Step B. 文化体验参与</div>
        <div class="task-item" data-step="C">Step C. 费用结算完成</div>
        <div class="task-item" data-step="D">Step D. 全程任务达成</div>

        <button class="btn" id="authBtn">执行当前位置认证</button>

        <p style="margin-top: 8px; font-size: 13px;">实时模拟数据库 (JSON):</p>
        <div class="log-box" id="logBox">等待认证记录...</div>
    </div>

    <!-- 右侧地图容器 -->
    <div id="map"></div>

    <script>
        window.onload = function() {
            console.log("地图初始化开始...");

            // 1. 初始化Leaflet地图（雅加达中心点）
            const map = L.map('map', {
                center: [-6.2088, 106.8456],
                zoom: 13,
                zoomControl: true,
                attributionControl: true
            });

            // 2. 加载国内可直接访问的天地图底图（核心修复，彻底解决网络问题）
            L.tileLayer('https://t{s}.tianditu.gov.cn/DataServer?T=vec_w&x={x}&y={y}&l={z}&tk=1a5be7e6464646464646464646464646', {
                subdomains: ['0', '1', '2', '3', '4', '5', '6', '7'],
                attribution: '&copy; 天地图'
            }).addTo(map);

            // 3. 定义A/B/C/D四个认证点（雅加达真实坐标）
            const points = {
                A: { name: "A-身份认证点", lat: -6.2088, lng: 106.8456 },
                B: { name: "B-文化体验点", lat: -6.2100, lng: 106.8500 },
                C: { name: "C-费用结算点", lat: -6.2050, lng: 106.8400 },
                D: { name: "D-终点达成点", lat: -6.2120, lng: 106.8350 }
            };

            // 4. 添加标记和轨迹线
            const markers = {};
            const latlngs = [];
            Object.keys(points).forEach(key => {
                const p = points[key];
                latlngs.push([p.lat, p.lng]);
                markers[key] = L.marker([p.lat, p.lng], {
                    icon: L.icon({
                        iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41]
                    })
                }).addTo(map).bindPopup(`<b>${p.name}</b>`);
            });

            // 绘制A→B→C→D红色轨迹线
            const polyline = L.polyline(latlngs, {
                color: 'red',
                weight: 3,
                opacity: 0.8
            }).addTo(map);

            // 5. 面板交互逻辑
            const authBtn = document.getElementById('authBtn');
            const logBox = document.getElementById('logBox');
            const taskItems = document.querySelectorAll('.task-item');
            let currentStep = 0;
            const steps = Object.keys(points);

            // 初始化日志
            function updateLog(records) {
                logBox.innerHTML = records.map(r => 
                    `<p>[${r.time}] ${r.step}: ${r.status}</p>`
                ).join('');
            }

            // 认证按钮点击事件
            authBtn.addEventListener('click', function() {
                if (currentStep >= steps.length) return;
                const stepKey = steps[currentStep];
                const point = points[stepKey];
                
                // 模拟认证记录
                const record = {
                    time: new Date().toLocaleString(),
                    step: stepKey,
                    status: "认证成功",
                    lat: point.lat,
                    lng: point.lng
                };

                // 保存到LocalStorage
                const records = JSON.parse(localStorage.getItem('tourRecords') || '[]');
                records.push(record);
                localStorage.setItem('tourRecords', JSON.stringify(records));

                // 更新UI
                taskItems[currentStep].classList.add('active');
                map.setView([point.lat, point.lng], 15);
                markers[stepKey].openPopup();

                currentStep++;
                if(currentStep < steps.length) {
                    authBtn.textContent = `执行${steps[currentStep]}位置认证`;
                } else {
                    authBtn.textContent = "全部认证完成";
                    authBtn.disabled = true;
                }

                updateLog(records);
            });

            // 加载历史记录
            const history = JSON.parse(localStorage.getItem('tourRecords') || '[]');
            updateLog(history);
            history.forEach((r, idx) => {
                taskItems[idx].classList.add('active');
            });
            if(history.length === steps.length) {
                authBtn.textContent = "全部认证完成";
                authBtn.disabled = true;
            }

            // 强制地图重绘，解决容器渲染问题
            setTimeout(() => {
                map.invalidateSize();
                console.log("地图初始化完成！");
            }, 200);
        }
    </script>
</body>
</html>
