<!DOCTYPE html>
<html>
<head>
    <title>GIS Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="sidebar">
        <h2 id="title">印尼游客任务面板</h2>
        <div class="task-box">
            <p>当前任务：前往 <b>A点</b> 认证</p>
            <ul id="step-list">
                <li id="li-A" class="active">A. 身份核验</li>
                <li id="li-B">B. 活动参与</li>
                <li id="li-C">C. 材料费结算</li>
                <li id="li-D">D. 活动认证完成</li>
            </ul>
            <button id="certifyBtn" onclick="processCert()">执行认证</button>
        </div>
        <div id="db-view">数据库实时记录：<pre id="log"></pre></div>
    </div>
    <div id="map"></div>
    <!-- 引入其他人的JS -->
    <script src="js/logic.js"></script>
    <script src="js/map.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=你的KEY&callback=initMap" async defer></script>
</body>
</html>
