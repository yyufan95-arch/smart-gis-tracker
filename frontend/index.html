<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Smart Tour GIS 印尼游客追踪系统</title>
    <!-- 1. 强制引入Leaflet，放在最顶部 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 2. 全局强制重置，100%保证样式生效 */
        * {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }
        html, body {
            height: 100vh !important;
            width: 100vw !important;
            overflow: hidden !important;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f0f0 !important;
        }

        /* 3. 左侧面板：绝对定位，固定宽度 */
        #sidebar {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 320px !important;
            height: 100vh !important;
            background: #ffffff !important;
            border-right: 2px solid #e0e0e0 !important;
            z-index: 1000 !important;
            padding: 20px !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 12px !important;
        }

        /* 4. 右侧地图：绝对定位，撑满剩余空间（核心修复） */
        #map {
            position: absolute !important;
            top: 0 !important;
            left: 320px !important;
            right: 0 !important;
            bottom: 0 !important;
            background: #e5e3df !important;
            z-index: 1 !important;
            min-height: 100vh !important;
            min-width: calc(100vw - 320px) !important;
        }

        /* 面板样式 */
        .task-item {
            padding: 14px !important;
            border: 1px solid #e0e0e0 !important;
            border-radius: 6px !important;
            background: #fff !important;
            font-size: 15px !important;
        }
        .task-item.active {
            border-color: #1a73e8 !important;
            background: #e3f2fd !important;
        }
        .btn {
            width: 100% !important;
            padding: 14px !important;
            background: #1a73e8 !important;
            color: white !important;
            border: none !important;
            border-radius: 6px !important;
            font-size: 16px !important;
            cursor: pointer !important;
            margin-top: 8px !important;
        }
        .btn:disabled {
            background: #90caf9 !important;
            cursor: not-allowed !important;
        }
        .log-box {
            margin-top: 12px !important;
            flex: 1 !important;
            background: #1e1e1e !important;
            color: #00ff00 !important;
            padding: 12px !important;
            border-radius: 6px !important;
            overflow-y: auto !important;
            font-family: monospace !important;
            font-size: 12px !important;
        }
        h1 {
            color: #1a73e8 !important;
            font-size: 24px !important;
            margin-bottom: 8px !important;
        }
        .info-text {
            font-size: 13px !important;
            color: #666 !important;
            line-height: 1.5 !important;
        }
    </style>
</head>
<body>
    <!-- 左侧任务面板 -->
    <div id="sidebar">
        <h1>Smart Tour GIS</h1>
        <div class="info-text">
            游客组: 印尼团 (20人)<br>
            坐标系: WGS84 (雅加达)
        </div>

        <div class="task-item" data-step="A">Step A. 身份认证签到</div>
        <div class="task-item" data-step="B">Step B. 文化体验参与</div>
        <div class="task-item" data-step="C">Step C. 费用结算完成</div>
        <div class="task-item" data-step="D">Step D. 全程任务达成</div>

        <button class="btn" id="authBtn">执行当前位置认证</button>

        <p style="margin-top: 8px; font-size: 13px;">实时模拟数据库 (JSON):</p>
        <div class="log-box" id="logBox">等待认证记录...</div>
    </div>

    <!-- 右侧地图容器 -->
    <div id="map"></div>

    <script>
        // 5. 强制页面完全加载后再执行地图代码
        window.addEventListener('load', function() {
            console.log("=== 地图初始化开始 ===");

            // 6. 初始化Leaflet地图（雅加达中心点）
            const map = L.map('map', {
                center: [-6.2088, 106.8456],
                zoom: 13,
                zoomControl: true,
                attributionControl: true
            });

            // 7. 【核心修复】强制加载OpenStreetMap底图（国内可直接访问）
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);

            console.log("=== 底图加载完成 ===");

            // 8. 定义A/B/C/D四个认证点（雅加达真实坐标）
            const points = {
                A: { name: "A-身份认证点", lat: -6.2088, lng: 106.8456 },
                B: { name: "B-文化体验点", lat: -6.2100, lng: 106.8500 },
                C: { name: "C-费用结算点", lat: -6.2050, lng: 106.8400 },
                D: { name: "D-终点达成点", lat: -6.2120, lng: 106.8350 }
            };

            // 9. 添加标记和轨迹线
            const markers = {};
            const latlngs = [];
            Object.keys(points).forEach(key => {
                const p = points[key];
                latlngs.push([p.lat, p.lng]);
                markers[key] = L.marker([p.lat, p.lng]).addTo(map);
                markers[key].bindPopup(`<b>${p.name}</b>`);
            });

            // 绘制A→B→C→D红色轨迹线
            L.polyline(latlngs, {
                color: 'red',
                weight: 3,
                opacity: 0.8
            }).addTo(map);

            // 10. 面板交互逻辑
            const authBtn = document.getElementById('authBtn');
            const logBox = document.getElementById('logBox');
            const taskItems = document.querySelectorAll('.task-item');
            let currentStep = 0;
            const steps = Object.keys(points);

            // 初始化日志
            function updateLog(records) {
                logBox.innerHTML = records.map(r => 
                    `<p>[${r.time}] ${r.step}: ${r.status}</p>`
                ).join('');
            }

            // 认证按钮点击事件
            authBtn.addEventListener('click', function() {
                if (currentStep >= steps.length) return;
                const stepKey = steps[currentStep];
                const point = points[stepKey];
                
                // 模拟认证记录
                const record = {
                    time: new Date().toLocaleString(),
                    step: stepKey,
                    status: "认证成功",
                    lat: point.lat,
                    lng: point.lng
                };

                // 保存到LocalStorage
                const records = JSON.parse(localStorage.getItem('tourRecords') || '[]');
                records.push(record);
                localStorage.setItem('tourRecords', JSON.stringify(records));

                // 更新UI
                taskItems[currentStep].classList.add('active');
                map.setView([point.lat, point.lng], 15);
                markers[stepKey].openPopup();

                currentStep++;
                if(currentStep < steps.length) {
                    authBtn.textContent = `执行${steps[currentStep]}位置认证`;
                } else {
                    authBtn.textContent = "全部认证完成";
                    authBtn.disabled = true;
                }

                updateLog(records);
            });

            // 加载历史记录
            const history = JSON.parse(localStorage.getItem('tourRecords') || '[]');
            updateLog(history);
            history.forEach((r, idx) => {
                taskItems[idx].classList.add('active');
            });
            if(history.length === steps.length) {
                authBtn.textContent = "全部认证完成";
                authBtn.disabled = true;
            }

            // 11. 强制地图重绘，解决容器渲染问题
            setTimeout(() => {
                map.invalidateSize();
                console.log("=== 地图初始化完成 ===");
            }, 300);
        });
    </script>
</body>
</html>
