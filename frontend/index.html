    <style>

        body, html {

            margin: 0;
            display: flex;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #sidebar {
            width: 320px;
            height: 100vh;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        #map {
            flex: 1;
            height: 100vh;
            background: #e5e3df; /* 地图加载前的底色 */
        }
        h2 { color: #1a73e8; font-size: 20px; }
        .task-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        #step-list {
            list-style: none;
            padding: 0;
        }
        #step-list li {
            padding: 12px;
            margin-bottom: 8px;
            background: white;
            border-radius: 6px;
            border: 1px solid #ddd;
            color: #555;
        }
        /* 任务完成后的样式 */
        .completed {
            border-left: 5px solid #34a853 !important;
            color: #34a853 !important;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        #log {
            flex: 1;
            background: #202124;
            color: #34a853;
            padding: 10px;
            font-size: 11px;
            border-radius: 4px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
