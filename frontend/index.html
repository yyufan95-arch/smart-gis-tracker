<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Smart Tour GIS 인도네시아 관광객 추적 시스템</title>
    <!-- 1. Leaflet 라이브러리 로드 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 2. 기초 레이아웃 초기화 */
        * {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }
        html, body {
            height: 100vh !important;
            width: 100vw !important;
            overflow: hidden !important;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            background: #f0f0f0 !important;
        }

        /* 3. 왼쪽 패널 */
        #sidebar {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 320px !important;
            height: 100vh !important;
            background: #ffffff !important;
            border-right: 2px solid #e0e0e0 !important;
            z-index: 1000 !important;
            padding: 20px !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 12px !important;
        }

        /* 4. 오른쪽 지도 */
        #map {
            position: absolute !important;
            top: 0 !important;
            left: 320px !important;
            right: 0 !important;
            bottom: 0 !important;
            background: #e5e3df !important;
            z-index: 1 !important;
        }

        h1 { color: #1a73e8 !important; font-size: 24px !important; margin-bottom: 4px !important; }
        .info-text { font-size: 13px !important; color: #666 !important; line-height: 1.6 !important; margin-bottom: 10px !important; }
        
        .task-item {
            padding: 14px !important;
            border: 1px solid #e0e0e0 !important;
            border-radius: 6px !important;
            background: #fff !important;
            font-size: 14px !important;
        }
        .task-item.active {
            border-left: 5px solid #34a853 !important;
            background: #f0fff4 !important;
            color: #2e7d32 !important;
            font-weight: bold !important;
        }

        .btn {
            width: 100% !important;
            padding: 14px !important;
            background: #1a73e8 !important;
            color: white !important;
            border: none !important;
            border-radius: 6px !important;
            font-size: 16px !important;
            cursor: pointer !important;
            font-weight: bold !important;
        }
        .btn:disabled { background: #ccc !important; cursor: not-allowed !important; }

        .log-box {
            flex: 1 !important;
            background: #1e1e1e !important;
            color: #34a853 !important;
            padding: 12px !important;
            border-radius: 6px !important;
            overflow-y: auto !important;
            font-family: 'Consolas', monospace !important;
            font-size: 12px !important;
            margin-top: 10px !important;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Smart Tour GIS</h1>
        <div class="info-text">
            <b>미션 대상:</b> 인도네시아 단체 (20명)<br>
            <b>좌표 시스템:</b> WGS84 (자카르타)
        </div>

        <div class="task-item" id="step-A">Step A. 신원 인증 및 체크인</div>
        <div class="task-item" id="step-B">Step B. 문화 체험 참여</div>
        <div class="task-item" id="step-C">Step C. 비용 결제 완료</div>
        <div class="task-item" id="step-D">Step D. 전체 미션 달성</div>

        <button class="btn" id="authBtn">Step A 인증 수행</button>

        <p style="margin-top: 10px; font-size: 12px; font-weight: bold; color: #444;">실시간 DB 시뮬레이션 (JSON):</p>
        <div class="log-box" id="logBox">인증 기록 대기 중...</div>
    </div>

    <div id="map"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 지도 초기화
            const map = L.map('map', { zoomControl: false }).setView([-6.2088, 106.8456], 13);

            // 타일 레이어 (CartoDB)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            L.control.zoom({ position: 'topright' }).addTo(map);

            const points = [
                { id: 'A', name: "A-신원 인증 지점", lat: -6.2088, lng: 106.8456 },
                { id: 'B', name: "B-문화 체험 지점", lat: -6.2100, lng: 106.8500 },
                { id: 'C', name: "C-비용 결제 지点", lat: -6.2050, lng: 106.8400 },
                { id: 'D', name: "D-최종 도착 지점", lat: -6.2120, lng: 106.8350 }
            ];

            const markers = {};
            const latlngs = points.map(p => [p.lat, p.lng]);

            points.forEach(p => {
                markers[p.id] = L.marker([p.lat, p.lng]).addTo(map);
                markers[p.id].bindPopup(`<b>${p.name}</b>`);
            });

            L.polyline(latlngs, { color: '#d93025', weight: 4, opacity: 0.7, dashArray: '5, 10' }).addTo(map);

            const authBtn = document.getElementById('authBtn');
            const logBox = document.getElementById('logBox');
            let currentStepIdx = 0;

            function updateLog() {
                const records = JSON.parse(localStorage.getItem('tourRecords') || '[]');
                if (records.length === 0) {
                    logBox.innerHTML = "인증 기록 대기 중...";
                    return;
                }
                logBox.innerHTML = records.map(r => 
                    `<div><span style="color: #aaa;">[${r.time.split(' ')[1]}]</span> <b style="color: #fff;">${r.step}</b>: ${r.status}</div>`
                ).join('');
                logBox.scrollTop = logBox.scrollHeight;
            }

            authBtn.addEventListener('click', function() {
                if (currentStepIdx >= points.length) return;

                const p = points[currentStepIdx];
                const now = new Date();
                
                const record = {
                    time: now.toLocaleString(),
                    step: p.id,
                    status: "인증 통과됨", // 韩文：认证通过
                    coords: `${p.lat}, ${p.lng}`
                };

                const records = JSON.parse(localStorage.getItem('tourRecords') || '[]');
                records.push(record);
                localStorage.setItem('tourRecords', JSON.stringify(records));

                document.getElementById(`step-${p.id}`).classList.add('active');
                map.flyTo([p.lat, p.lng], 15);
                markers[p.id].openPopup();

                currentStepIdx++;

                if (currentStepIdx < points.length) {
                    authBtn.textContent = `Step ${points[currentStepIdx].id} 인증 수행`;
                } else {
                    authBtn.textContent = "모든 미션 완료 ✓";
                    authBtn.disabled = true;
                }
                updateLog();
            });

            localStorage.removeItem('tourRecords'); 
            updateLog();
            setTimeout(() => { map.invalidateSize(); }, 500);
        });
    </script>
</body>
</html>
