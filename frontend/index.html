<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>印尼游客 A-B-C-D 认证追踪系统</title>
    <!-- 引入Leaflet地图库 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 全局重置，强制页面撑满 */
        * {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }
        html, body {
            height: 100vh !important;
            width: 100vw !important;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 左侧面板：固定宽度，绝对定位 */
        #sidebar {
            position: absolute;
            top: 0;
            left: 0;
            width: 320px;
            height: 100vh;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* 右侧地图：绝对定位，撑满剩余空间（核心修复） */
        #map {
            position: absolute;
            top: 0;
            left: 320px;
            right: 0;
            bottom: 0;
            background: #e5e3df;
            z-index: 1;
        }

        /* 面板样式 */
        .task-item {
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .task-item.active {
            border-color: #1a73e8;
            background: #e3f2fd;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 16px;
        }
        .btn:disabled {
            background: #90caf9;
            cursor: not-allowed;
        }
        .log-box {
            margin-top: 20px;
            flex: 1;
            background: #1e1e1e;
            color: #00ff00;
            padding: 12px;
            border-radius: 6px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        h2 {
            color: #1a73e8;
            font-size: 20px;
            margin-bottom: 16px;
        }
        .status-text {
            font-size: 16px;
            margin-bottom: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- 左侧任务面板 -->
    <div id="sidebar">
        <h2>印尼游客任务面板</h2>
        <p class="status-text">状态：<span id="status">准备开始认证</span></p>
        
        <div class="task-item" data-place="A">A. 身份核验 (认证点)</div>
        <div class="task-item" data-place="B">B. 文化活动 (参与点)</div>
        <div class="task-item" data-place="C">C. 材料费结算 (支付点)</div>
        <div class="task-item" data-place="D">D. 活动认证完成 (目标点)</div>

        <button class="btn" id="authBtn">点击执行当前认证</button>

        <p style="margin-top: 20px; font-size: 14px;">模拟数据库记录 (LocalStorage):</p>
        <div class="log-box" id="logBox"></div>
    </div>

    <!-- 右侧地图容器 -->
    <div id="map"></div>

    <script>
        // 页面完全加载后，强制初始化地图
        window.onload = function() {
            console.log("地图初始化开始..."); // 控制台可看到，确认代码执行
            
            // 1. 初始化Leaflet地图，印尼雅加达中心点
            const map = L.map('map', {
                center: [-6.2088, 106.8456],
                zoom: 13,
                zoomControl: true
            });

            // 2. 加载开源OpenStreetMap底图（国内秒加载）
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // 3. 定义A/B/C/D四个认证点
            const places = {
                A: { name: "A-身份核验点", lat: -6.2088, lng: 106.8456 },
                B: { name: "B-文化活动点", lat: -6.2100, lng: 106.8500 },
                C: { name: "C-支付结算点", lat: -6.2050, lng: 106.8400 },
                D: { name: "D-终点认证点", lat: -6.2120, lng: 106.8350 }
            };

            // 4. 添加标记
            const markers = {};
            Object.keys(places).forEach(key => {
                const p = places[key];
                markers[key] = L.marker([p.lat, p.lng]).addTo(map);
                markers[key].bindPopup(`<b>${p.name}</b>`);
            });

            // 面板交互逻辑
            const statusEl = document.getElementById('status');
            const authBtn = document.getElementById('authBtn');
            const logBox = document.getElementById('logBox');
            const taskItems = document.querySelectorAll('.task-item');
            let currentStep = 0;
            const steps = Object.keys(places);

            // 初始化日志
            function updateLog() {
                const records = JSON.parse(localStorage.getItem('tourRecords') || '[]');
                logBox.innerHTML = records.map(r => 
                    `<p>[${r.time}] ${r.place}: ${r.status}</p>`
                ).join('');
            }

            // 认证按钮
            authBtn.addEventListener('click', function() {
                if (currentStep >= steps.length) return;
                const placeKey = steps[currentStep];
                const place = places[placeKey];
                
                // 保存记录
                const record = {
                    time: new Date().toLocaleString(),
                    place: placeKey,
                    status: "认证成功",
                    lat: place.lat,
                    lng: place.lng
                };
                const records = JSON.parse(localStorage.getItem('tourRecords') || '[]');
                records.push(record);
                localStorage.setItem('tourRecords', JSON.stringify(records));

                // 更新UI
                taskItems[currentStep].classList.add('active');
                map.setView([place.lat, place.lng], 16);
                markers[placeKey].openPopup();

                currentStep++;
                if(currentStep < steps.length) {
                    statusEl.textContent = `当前认证：${steps[currentStep]}`;
                } else {
                    statusEl.textContent = "全部认证完成！";
                    authBtn.disabled = true;
                    authBtn.textContent = "认证全部完成";
                }
                updateLog();
            });

            updateLog();
            console.log("地图初始化完成！"); // 控制台确认
        }
    </script>
</body>
</html>
